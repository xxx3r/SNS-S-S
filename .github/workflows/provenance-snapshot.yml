name: provenance-snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact accepted main SHA observed by the requesting loop
        required: true
        type: string
      loop_id:
        description: Repository loop ID
        required: true
        type: choice
        options:
          - daily-governance-triage
          - daily-research-operator
          - weekly-evidence-synthesis
          - monthly-governance
          - system-audit
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute snapshot without publishing a research receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ inputs.source_commit || github.sha }}
          LOOP_ID: ${{ inputs.loop_id || 'weekly-evidence-synthesis' }}
          PYTHONPATH: .
        run: python scripts/provenance_snapshot.py --source-commit "$EXPECTED_SOURCE" --loop-id "$LOOP_ID" --output-dir /tmp/sns-provenance
      - uses: actions/upload-artifact@v4
        with:
          name: sns-provenance
          path: /tmp/sns-provenance/*.json
