name: automation-transaction

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "AURORA.md"
      - "automation/**"
      - "calendar/evidence/**"
      - "calendar/belief_events/**"
      - "quests/actions/**"
      - "quests/proposed/**"
      - "quests/blocked/**"
      - "scripts/roundup_to_quests.py"
      - "src/research/**"
      - "tests/test_automation_*.py"
      - "pyproject.toml"
      - ".github/workflows/automation-transaction.yml"
  push:
    branches: [main]
    paths:
      - "automation/**"
      - "tests/test_automation_*.py"
      - ".github/workflows/automation-transaction.yml"

jobs:
  transaction-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_automation_*.py
      - run: python -m automation.cli validate-repository
      - run: python -m pytest -q
